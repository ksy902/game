<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>言靈爭霸 - 漫畫硬核版</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --c-black: #0f0f0f;
            --c-white: #fdfdfd;
            --c-red: #e6203a;
            --c-green: #00b35a;
            --c-cyan: #00e5ff;
            --c-yellow: #ffdb00;
            --c-purple: #7a1fd1; 
            --c-orange: #ff6600;
            --c-gray: #dddddd;
            --stroke: 3px solid var(--c-black);
            --shadow-solid: 6px 6px 0 var(--c-black);
        }

        * { 
            box-sizing: border-box; 
            font-family: "Noto Serif TC", "BiauKai", "Kaiti TC", "DFKai-SB", "PMingLiU", serif; 
            user-select: none; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            margin: 0; padding: 0; background-color: var(--c-white); color: var(--c-black);
            background-image: radial-gradient(var(--c-black) 5%, transparent 6%), radial-gradient(var(--c-black) 5%, transparent 6%);
            background-size: 20px 20px; background-position: 0 0, 10px 10px;
            height: 100vh; 
            height: -webkit-fill-available;
            display: flex; flex-direction: column; overflow: hidden;
            transition: background-color 0.3s;
        }

        /* 危機晃動動畫：0.5秒特效 */
        @keyframes crisisShake {
            0% { transform: translate(0,0) rotate(0deg); }
            10% { transform: translate(8px, 8px) rotate(1deg); }
            20% { transform: translate(-8px, -8px) rotate(-1deg); }
            30% { transform: translate(8px, -8px) rotate(1deg); }
            40% { transform: translate(-8px, 8px) rotate(-1deg); }
            50% { transform: translate(0,0) rotate(0deg); }
            100% { transform: translate(0,0) rotate(0deg); }
        }
        .crisis-shake-active { 
            animation: crisisShake 0.15s ease-in-out infinite;
            background-color: rgba(230, 32, 58, 0.1) !important;
        }

        .svg-icon { width: 18px; height: 18px; fill: currentColor; }

        /* UI 組件 */
        .btn {
            background: var(--c-yellow); border: var(--stroke); box-shadow: 4px 4px 0 var(--c-black);
            font-weight: 900; font-size: 0.95rem; padding: 8px 14px; cursor: pointer;
            display: inline-flex; align-items: center; gap: 6px; transition: 0.1s; transform: skew(-5deg);
        }
        .btn:active { transform: skew(-5deg) translate(4px, 4px); box-shadow: 0 0 0 var(--c-black); }
        .btn:disabled { background: #bbb; cursor: not-allowed; color: #555;}
        .btn-red { background: var(--c-red); color: white; }

        .bar {
            background: var(--c-white); border-bottom: var(--stroke); padding: 10px 20px;
            display: flex; justify-content: space-between; align-items: center; z-index: 10;
        }
        .bar.bottom { 
            border-bottom: none; border-top: var(--stroke); 
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
        }

        .player-info { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 1.1rem; }
        .avatar { width: 36px; height: 36px; border: 2px solid var(--c-black); border-radius: 50%; padding: 4px; background: var(--c-gray); }
        .hp-badge { background: var(--c-black); color: var(--c-white); padding: 2px 10px; border-radius: 20px; }
        
        .char-label { font-size: 0.85rem; padding: 3px 8px; border: 2px solid var(--c-black); margin-left: 5px; font-weight: 900;}
        .player-label { background: var(--c-cyan); }

        /* 場上字詞區 */
        .field {
            flex: 1; display: flex; justify-content: center; align-items: flex-start; gap: 20px;
            padding: 30px 20px; overflow-y: auto; flex-wrap: wrap; align-content: flex-start;
        }
        
        .target-card {
            width: 140px; height: 180px; background: var(--c-black); color: var(--c-white);
            border: 4px solid var(--c-white); outline: 4px solid var(--c-black);
            box-shadow: var(--shadow-solid); padding: 15px 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s; transform: skew(-2deg);
            touch-action: none; 
        }
        .t-word { font-size: 4rem; font-weight: 900; line-height: 1; margin-bottom: 15px; text-shadow: 3px 3px 0 #555; }
        
        .diamond-container { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        .diamond { width: 14px; height: 14px; border: 2px solid #555; transform: rotate(45deg); transition: 0.3s; }
        .diamond.on { background: var(--c-green); border-color: var(--c-white); box-shadow: 0 0 10px var(--c-green); }

        /* 手牌區：iPad 高度適配 */
        .hand-area {
            height: 26vh; min-height: 180px;
            background: repeating-linear-gradient(45deg, #eee 0, #eee 2px, transparent 2px, transparent 8px);
            border-top: var(--stroke); display: flex; justify-content: center; align-items: flex-end; padding: 10px 20px; gap: 10px; overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .play-card {
            width: 110px; height: 90%; background: var(--c-white); border: var(--stroke); box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
            padding: 10px; cursor: pointer; transition: 0.2s; 
            display: flex; flex-direction: column; flex-shrink: 0; position: relative;
        }
        .play-card.selected { transform: translateY(-20px); border-color: var(--c-cyan); box-shadow: 0 0 0 4px var(--c-cyan), 8px 8px 0 var(--c-black); z-index: 30; }
        .play-card.is-func { background-color: var(--c-purple); color: var(--c-white); }
        .c-tag { font-size: 0.75rem; font-weight: 900; background: var(--c-black); color: var(--c-white); padding: 2px 6px; align-self: flex-start; margin-bottom: 5px; border: 1px solid var(--c-white);}
        .c-text { font-size: 1.1rem; font-weight: 900; text-align: center; display: flex; align-items: center; justify-content: center; flex: 1; word-break: break-all;}

        /* Modal & SFX */
        #detail-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 500; display: none; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--c-white); border: 6px solid var(--c-black); box-shadow: 15px 15px 0 var(--c-cyan); width: 100%; max-width: 400px; padding: 25px; transform: skew(-2deg); }
        .sfx-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 999; display: flex; justify-content: center; align-items: center; }
        .sfx-box { background: var(--c-white); border: 6px solid var(--c-black); padding: 20px 40px; font-size: 2.5rem; font-weight: 900; transform: scale(0); opacity: 0; box-shadow: 15px 15px 0 var(--c-black); }
        
        @keyframes popInStay {
            0% { transform: scale(0) skew(-5deg); opacity: 0; }
            10% { transform: scale(1.1) skew(-5deg); opacity: 1; }
            85% { transform: scale(1) skew(-5deg); opacity: 1; }
            100% { transform: scale(0.8) skew(-5deg); opacity: 0; }
        }

        #lobby-modal { position: fixed; inset: 0; background: var(--c-black); z-index: 2000; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .lobby-content { background: var(--c-white); border: 6px solid var(--c-black); box-shadow: 20px 20px 0 var(--c-cyan); width: 100%; max-width: 600px; padding: 30px; transform: skew(-1deg); }

        .grid-select { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 15px 0; }
        .select-card { border: 3px solid var(--c-black); background: var(--c-gray); padding: 10px; cursor: pointer; width: 110px; text-align: center; font-weight: bold;}
        .select-card.active { background: var(--c-yellow); border-color: var(--c-red); box-shadow: 4px 4px 0 var(--c-black); }

        @media (max-width: 768px) {
            .t-word { font-size: 3rem; }
            .target-card { width: 110px; height: 150px; }
            .play-card { width: 95px; }
        }
    </style>
</head>
<body>

<!-- 音訊資源 -->
<audio id="bgm" loop src="https://cdn.pixabay.com/audio/2022/03/10/audio_784d0b1352.mp3"></audio> 
<audio id="sfx-draw" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>
<audio id="sfx-correct" src="https://assets.mixkit.co/active_storage/sfx/2068/2068-preview.mp3"></audio>
<audio id="sfx-error" src="https://assets.mixkit.co/active_storage/sfx/2648/2648-preview.mp3"></audio>

<svg style="display: none;">
    <symbol id="icon-player" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></symbol>
    <symbol id="icon-ai" viewBox="0 0 24 24"><path d="M21 9h-2V7c0-1.1-.9-2-2-2h-3.5l-1-2h-5l-1 2H3c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2v-8c0-1.1-.9-2-2-2zm-9 9c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M16 9v10H8V9h8m-1.5-6h-5l-1 1H5v2h14V4h-3.5l-1-1z"/></symbol>
</svg>

<div id="lobby-modal">
    <div class="lobby-content">
        <h2 style="text-align:center; font-size:2rem; border-bottom:4px solid #000;">言靈爭霸 - 戰前備案</h2>
        <p>選擇挑戰者職階：</p>
        <div class="grid-select" id="char-select-group">
            <div class="select-card active" onclick="selectChar('seer', this)">【天機】</div>
            <div class="select-card" onclick="selectChar('knight', this)">【墨俠】</div>
            <div class="select-card" onclick="selectChar('trickster', this)">【詭道】</div>
            <div class="select-card" onclick="selectChar('rock', this)">【磐石】</div>
            <div class="select-card" onclick="selectChar('berserker', this)">【狂草】</div>
        </div>
        <p>設定敵方難度：</p>
        <div class="grid-select">
            <div class="select-card active" onclick="selectDiff('normal', this)">普通記憶</div>
            <div class="select-card" onclick="selectDiff('hard', this)">絕對記憶</div>
        </div>
        <button class="btn btn-red" style="width:100%; padding:15px; font-size:1.5rem; margin-top:20px;" onclick="startGame()">確認出戰 (開啟音樂)</button>
    </div>
</div>

<div class="sfx-overlay"><div id="sfx-layer" class="sfx-box"></div></div>
<div id="detail-modal"><div class="modal-content" id="detail-content"></div></div>

<div class="bar">
    <div class="player-info">
        <svg class="avatar"><use href="#icon-ai"></use></svg>
        <div>AI 對手</div>
        <div class="hp-badge" id="ai-hand-count">5 張</div>
    </div>
    <div id="turn-display" style="padding: 5px 15px; font-weight: 900; background: var(--c-cyan);">等待中</div>
</div>

<div class="field" id="field-area"></div>

<div class="bar bottom">
    <div class="player-info">
        <svg class="avatar"><use href="#icon-player"></use></svg>
        <div class="char-label player-label" id="player-label-text">天機</div>
        <div class="hp-badge" id="player-hand-count">5 張</div>
    </div>
    <div style="display:flex; gap:8px;">
        <button class="btn btn-white" id="pass-btn" onclick="passTurn()" disabled>PASS</button>
        <button class="btn btn-red" id="discard-btn" onclick="discardSelected()" disabled>捨棄</button>
    </div>
</div>

<div class="hand-area" id="hand-area"></div>

<script>
const allRawData = [
  {"字詞":"拔","字義":["抽出","提拔","攻取"]}, {"字詞":"汲","字義":["從井裡打水","引導"]},
  {"字詞":"抵","字義":["推擠","抵達"]}, {"字詞":"受","字義":["給予","接受","教授"]},
  {"字詞":"奉","字義":["雙手恭敬捧著","獻送","貫徹執行"]}, {"字詞":"予","字義":["給予","讚許"]},
  {"字詞":"微","字義":["美麗","藏匿","偷偷","若不是"]}, {"字詞":"易","字義":["賜與","交換","替代","整治"]},
  {"字詞":"敝","字義":["破舊衣服","損害","丟棄","失敗","疲憊"]}, {"字詞":"服","字義":["降服、使服從","從事","致力","任用"]},
  {"字詞":"舉","字義":["雙手托物","推薦","施行","攻克"]}, {"字詞":"使","字義":["差遣","使臣"]},
  {"字詞":"具","字義":["備辦","完備、詳盡","有"]}, {"字詞":"假","字義":["借用","憑藉","暫且"]},
  {"字詞":"謝","字義":["辭職","辭別","推辭","道歉"]}, {"字詞":"顧","字義":["回頭看","觀看","拜訪"]},
  {"字詞":"竟","字義":["完畢","全部"]}, {"字詞":"悉","字義":["詳盡","了解","全部"]},
  {"字詞":"臨","字義":["俯視","來到","管理"]}
];

let deck = [], discardPile = [], playerHand = [], aiHand = [], activeField = [];
let turn = 'player', selectedIndex = null, playerChar = 'seer', aiDiff = 'normal';
let isAiWarningActive = false;

const bgm = document.getElementById('bgm');
const sfxDraw = document.getElementById('sfx-draw');
const sfxCorrect = document.getElementById('sfx-correct');
const sfxError = document.getElementById('sfx-error');

function selectChar(c, el) {
    playerChar = c;
    document.querySelectorAll('#char-select-group .select-card').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('player-label-text').innerText = el.innerText;
}

function selectDiff(d, el) {
    aiDiff = d;
    el.parentElement.querySelectorAll('.select-card').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
}

function startGame() {
    bgm.volume = 0.3;
    bgm.play().catch(() => console.log("Audio play blocked"));
    document.getElementById('lobby-modal').style.display = 'none';
    initGame();
}

function initGame() {
    let shuffled = [...allRawData].sort(() => 0.5 - Math.random());
    let pool = shuffled.slice(0, 18);
    deck = [];
    pool.forEach(item => item.字義.forEach(m => deck.push({ type: 'meaning', parentWord: item.字詞, text: m })));
    for(let i=0; i<4; i++) deck.push({ type: 'func', action: 'attack', text: '令敵方罰抽牌' });
    shuffle(deck);

    let unspawned = [...pool];
    for(let i=0; i<3; i++) {
        let item = unspawned.splice(Math.floor(Math.random()*unspawned.length), 1)[0];
        activeField.push({ word: item.字詞, meanings: item.字義.map(m => ({ text: m, unlocked: false })) });
    }

    let pCount = (playerChar === 'seer') ? 4 : 5;
    let aCount = (aiDiff === 'hard') ? 3 : 5;
    for(let i=0; i<pCount; i++) playerHand.push(drawCard(false));
    for(let i=0; i<aCount; i++) aiHand.push(drawCard(false));
    
    updateUI();
    playSfx("戰場展開！", "player");
}

function shuffle(arr) { arr.sort(() => 0.5 - Math.random()); }

function drawCard(playSfxOn = true) {
    if (deck.length === 0) { deck = [...discardPile]; discardPile = []; shuffle(deck); }
    if (playSfxOn) { sfxDraw.currentTime = 0; sfxDraw.play(); }
    return deck.pop();
}

function updateUI() {
    document.getElementById('player-hand-count').innerText = playerHand.length + " 張";
    document.getElementById('ai-hand-count').innerText = aiHand.length + " 張";
    
    // --- 核心修改：危機警示系統 ---
    if (aiHand.length <= 2 && aiHand.length > 0) {
        if (!isAiWarningActive) {
            isAiWarningActive = true;
            // 裝置震動 1 秒
            if ("vibrate" in navigator) navigator.vibrate(1000);
            
            // 畫面晃動 0.5 秒後移除
            document.body.classList.add('crisis-shake-active');
            setTimeout(() => {
                document.body.classList.remove('crisis-shake-active');
            }, 500);

            playSfx("警告：敵方言靈將盡！", "error");
        }
    } else {
        isAiWarningActive = false;
        document.body.classList.remove('crisis-shake-active');
    }

    const turnDisp = document.getElementById('turn-display');
    turnDisp.innerText = turn === 'player' ? '你的回合' : '敵方回合';
    turnDisp.style.background = turn === 'player' ? 'var(--c-cyan)' : 'var(--c-red)';

    document.getElementById('pass-btn').disabled = (turn !== 'player');
    document.getElementById('discard-btn').disabled = (turn !== 'player' || selectedIndex === null);

    const fieldDOM = document.getElementById('field-area');
    fieldDOM.innerHTML = '';
    activeField.forEach((target, tIdx) => {
        const tCard = document.createElement('div');
        tCard.className = 'target-card';
        tCard.onpointerdown = (e) => { this.pressTimer = setTimeout(() => showModal(tIdx), 500); };
        tCard.onpointerup = (e) => {
            clearTimeout(this.pressTimer);
            if (document.getElementById('detail-modal').style.display !== 'flex') tryMatch(tIdx);
            else hideModal();
        };
        tCard.innerHTML = `<div class="t-word">${target.word}</div><div class="diamond-container">
            ${target.meanings.map(m => `<div class="diamond ${m.unlocked?'on':''}"></div>`).join('')}</div>`;
        fieldDOM.appendChild(tCard);
    });

    const handDOM = document.getElementById('hand-area');
    handDOM.innerHTML = '';
    playerHand.forEach((card, idx) => {
        const cDiv = document.createElement('div');
        cDiv.className = `play-card ${card.type==='func'?'is-func':''} ${idx===selectedIndex?'selected':''}`;
        cDiv.innerHTML = `<div class="c-tag">${card.type==='func'?'言靈':'字義'}</div><div class="c-text">${card.text}</div>`;
        cDiv.onclick = () => { if(turn==='player') { selectedIndex = (selectedIndex===idx)?null:idx; updateUI(); }};
        handDOM.appendChild(cDiv);
    });
    checkWin();
}

function tryMatch(tIdx) {
    if(turn !== 'player' || selectedIndex === null) return;
    let card = playerHand[selectedIndex];
    if(card.type === 'func') {
        discardPile.push(playerHand.splice(selectedIndex, 1)[0]);
        playSfx("言靈：狂襲敵方！", "player");
        aiHand.push(drawCard()); aiHand.push(drawCard());
        selectedIndex = null; updateUI(); setTimeout(endTurn, 1000);
        return;
    }

    let target = activeField[tIdx];
    let match = target.meanings.find(m => m.text === card.text && !m.unlocked);

    if (match) {
        sfxCorrect.play();
        match.unlocked = true;
        discardPile.push(playerHand.splice(selectedIndex, 1)[0]);
        if(target.meanings.every(m => m.unlocked)) {
            playSfx("完全解構！", "correct");
            for(let i=0; i<target.meanings.length; i++) aiHand.push(drawCard());
            activeField.splice(tIdx, 1);
        }
        selectedIndex = null; updateUI(); setTimeout(endTurn, 800);
    } else {
        sfxError.play();
        playSfx("配對失敗！罰抽", "error");
        playerHand.push(drawCard()); playerHand.push(drawCard());
        selectedIndex = null; updateUI(); setTimeout(endTurn, 1000);
    }
}

function endTurn() {
    turn = (turn === 'player') ? 'ai' : 'player';
    updateUI();
    if(turn === 'ai') setTimeout(aiAction, 1200);
}

function aiAction() {
    let matched = false;
    for(let i=0; i<aiHand.length; i++) {
        let card = aiHand[i];
        for(let t=0; t<activeField.length; t++) {
            let m = activeField[t].meanings.find(mm => mm.text === card.text && !mm.unlocked);
            if(m) {
                m.unlocked = true;
                aiHand.splice(i, 1);
                matched = true;
                if(activeField[t].meanings.every(mm => mm.unlocked)) activeField.splice(t, 1);
                break;
            }
        }
        if(matched) break;
    }
    if(!matched) aiHand.push(drawCard());
    updateUI(); setTimeout(endTurn, 1000);
}

function passTurn() {
    if(playerChar !== 'rock') playerHand.push(drawCard());
    endTurn();
}

function discardSelected() {
    discardPile.push(playerHand.splice(selectedIndex, 1)[0]);
    playerHand.push(drawCard());
    if(playerChar !== 'knight') playerHand.push(drawCard());
    selectedIndex = null; endTurn();
}

function showModal(tIdx) {
    const t = activeField[tIdx];
    document.getElementById('detail-content').innerHTML = `<h3 style="font-size:2.5rem; margin:0;">${t.word}</h3>` + 
        t.meanings.map(m => `<div style="padding:10px; border-bottom:1px solid #ccc;">${m.unlocked?m.text:'[ 未解鎖 ]'}</div>`).join('');
    document.getElementById('detail-modal').style.display = 'flex';
}
function hideModal() { document.getElementById('detail-modal').style.display = 'none'; }

function playSfx(txt, type) {
    const s = document.getElementById('sfx-layer');
    s.innerText = txt;
    s.style.animation = 'none'; void s.offsetWidth;
    s.style.animation = 'popInStay 2s forwards';
}

function checkWin() {
    if(playerHand.length === 0) { alert("你贏了！"); location.reload(); }
    if(aiHand.length === 0) { alert("你輸了..."); location.reload(); }
}
</script>
</body>
</html>
