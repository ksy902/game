<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>言靈爭霸 - 漫畫硬核版</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
       :root {
            --c-black: #0f0f0f; --c-white: #fdfdfd; --c-red: #e6203a;
            --c-green: #00b35a; --c-cyan: #00e5ff; --c-yellow: #ffdb00;
            --c-purple: #7a1fd1; --c-orange: #ff6600; --c-gray: #dddddd;
            --stroke: 3px solid var(--c-black); --shadow-solid: 6px 6px 0 var(--c-black);
        }

        * { box-sizing: border-box; font-family: "Noto Serif TC", serif; user-select: none; }
        
        body {
            margin: 0; padding: 0; 
            background-image: linear-gradient(rgba(255,255,255,0.5), rgba(255,255,255,0.5)), url('https://raw.githubusercontent.com/ksy902/game/main/%E8%83%8C%E6%99%AF.jpeg');
            background-size: cover; background-position: center; background-attachment: fixed;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* 角色卡片樣式 - 大廳專用 */
        .char-card {
            background-size: cover !important; background-position: center !important;
            height: 150px !important; justify-content: flex-end !important;
            color: white !important; text-shadow: 2px 2px 4px rgba(0,0,0,1);
            border: 3px solid var(--c-black) !important; transition: 0.2s;
        }
        .char-card .skill-desc { background: rgba(0,0,0,0.7); padding: 5px; width: 100%; font-size: 0.75rem; }
        .char-card.active { outline: 4px solid var(--c-red); transform: scale(1.05); background-color: var(--c-yellow) !important;}
        .play-card:not(.static-char-card):hover {
    transform: translateY(-15px);
    z-index: 20;
    box-shadow: 8px 8px 0 var(--c-black);
}
#result-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.9);
    z-index: 5000; display: none; justify-content: center; align-items: center;
}
.result-content {
    background: var(--c-white); border: 8px solid var(--c-black);
    padding: 40px; width: 90%; max-width: 500px; text-align: center;
    transform: skew(-2deg); box-shadow: 20px 20px 0 var(--c-yellow);
}
.result-title { font-size: 3.5rem; font-weight: 900; margin-bottom: 10px; }
.result-stats { font-size: 1.5rem; font-weight: 700; margin: 20px 0; border-top: 2px solid #000; padding-top: 20px; }
.winner-player { color: var(--c-cyan); text-shadow: 4px 4px 0 #000; }
.winner-ai { 
    color: var(--c-red) !important; 
    font-weight: 900; 
    text-shadow: none !important; 
}

/* 新增：結算界面關閉按鈕 (X) */
.close-result {
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 2rem;
    font-weight: 900;
    cursor: pointer;
    color: #000;
}
.close-result:hover { color: var(--c-red); }

/* 飛行卡片樣式：優化文字間距 */
.flying-card {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    transition: all 0.8s cubic-bezier(0.5, -0.5, 0.1, 1.5); 
    border: 3px solid var(--c-black); /* 與 var(--stroke) 一致 */
    background: var(--c-white); 
    padding: 10px; /* 同步手牌內距 */
    display: flex;
    flex-direction: column;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
}
        
/* 2. 角色固定卡基礎設定：看到整張圖片 */
.static-char-card {
    height: 95%; /* 稍微增加高度，確保露出更多細節 */
    aspect-ratio: 2 / 2.8;
    
    /* 【核心修改】確保圖片整張顯現 */
    background-size: contain;      /* 讓整張圖片縮放到卡片框內，不裁切 */
    background-repeat: no-repeat;  /* 防止圖片重複 */
    background-position: center bottom; /* 角色立足於卡片底部 */
    background-color: #222;        /* 增加深色背景，若立繪較窄則兩側留黑更有質感 */
    
    border: 4px solid var(--c-black) !important;
    box-shadow: 6px 6px 0 var(--c-black) !important;
    cursor: default !important; 
    transform: none !important; 
    position: relative;
    z-index: 10;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 8px !important;
}
.hand-area {
    height: 26vh;
    min-height: 180px;
    display: flex;
    justify-content: flex-start; /* 改為靠左對齊 */
    align-items: flex-end;
    padding: 10px 20px;
    gap: 12px;
    overflow-x: auto;
}

/* 固定角色牌：圖片完整顯示不裁切 */
.static-char-card {
    height: 90%;
    aspect-ratio: 2 / 2.8;
    background-size: contain !important; /* 強制整張圖片顯現 */
    background-repeat: no-repeat !important;
    background-position: center center !important;
    background-color: #1a1a1a !important; /* 增加背景色，防止圖片兩側留白 */
    border: 4px solid var(--c-black) !important;
    box-shadow: 6px 6px 0 var(--c-black) !important;
    cursor: default !important;
    transform: none !important;
    flex-shrink: 0;
    position: relative;
    z-index: 10;
}

/* 固定卡的文字效果 */
.static-char-card .c-text {
    color: white !important;
    text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
    font-size: 1.2rem !important;
    font-weight: 900;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 5px;
    background: linear-gradient(transparent, rgba(0,0,0,0.7));
}

/* 確保普通手牌才有動畫 */
.play-card:not(.static-char-card):hover {
    transform: translateY(-15px);
    z-index: 20;
    box-shadow: 8px 8px 0 var(--c-black);
}
        
/* 3. 固定卡上方的標籤 (職階) */
.static-char-card .c-tag {
    background: var(--c-red) !important;
    color: white !important;
    font-size: 0.7rem;
    border: 2px solid var(--c-black);
    padding: 2px 6px;
    align-self: flex-start;
    z-index: 2; /* 確保在圖片上方 */
}

/* 4. 固定卡下方的文字 (角色名稱) */
.static-char-card .c-text {
    color: white !important;
    /* 強化字體陰影，確保在各種顏色立繪下都清晰 */
    text-shadow: 
        2px 2px 0 #000, 
       -1px -1px 0 #000, 
        1px -1px 0 #000, 
       -1px 1px 0 #000,
        0 0 10px rgba(0,0,0,1);
    font-size: 1.3rem !important;
    font-weight: 900;
    align-items: flex-end; 
    justify-content: center;
    padding-bottom: 5px;
    z-index: 2;
    /* 增加底部黑邊漸層，讓名字更好讀 */
    background: linear-gradient(transparent 0%, rgba(0,0,0,0.8) 100%);
    width: calc(100% + 16px); /* 補回 padding */
    margin: 0 -8px -8px -8px;
}

/* 5. 確保手牌區域不會切掉卡片頂部 */
.hand-area {
    overflow-y: visible !important; /* 允許卡片頂部突出 */
    padding-top: 20px;
}
        .avatar { display: none; } 
        .svg-icon { width: 18px; height: 18px; fill: currentColor; }
        .btn { background: var(--c-yellow); border: var(--stroke); box-shadow: 4px 4px 0 var(--c-black); font-weight: 900; padding: 8px 14px; cursor: pointer; transform: skew(-5deg); }
        .btn:active { transform: skew(-5deg) translate(4px, 4px); box-shadow: 0 0 0; }
        .btn-red { background: var(--c-red); color: white; }
        .btn-cyan { background: var(--c-cyan); }
        .btn-purple { background: var(--c-purple); color: white; }
        .btn-orange { background: var(--c-orange); color: white; }
        .btn:disabled {
    background: var(--c-gray) !important; /* 使用淺灰色 */
    color: #888 !important;              /* 字體變灰 */
    border-color: #999 !important;       /* 邊框變淺 */
    box-shadow: none !important;         /* 移除陰影 */
    cursor: not-allowed;                 /* 滑鼠指標變更 */
    transform: none !important;          /* 移除斜切位移效果 */
}

/* 提示界面專用樣式 */

    position: fixed; inset: 0; background: rgba(0,0,0,0.85);

}

        .grid-select { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

            height: 90%; /* 跟隨容器高度 */

        }

        .play-card.is-func { 
            background-color: var(--c-purple); 
            background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.1) 0, rgba(0,0,0,0.1) 3px, transparent 3px, transparent 10px);
            color: var(--c-white); 
            border-color: var(--c-black); 
        }
        
        .c-tag { font-size: 0.8rem; font-weight: 900; background: var(--c-black); color: var(--c-white); padding: 4px 8px; align-self: flex-start; margin-bottom: 10px; border: 1px solid var(--c-white);}
        .play-card.is-func .c-tag { background: var(--c-yellow); color: var(--c-black); border: 2px solid var(--c-black); }
        
        .c-text { 
            font-size: clamp(0.9rem, 2vh, 1.15rem); /* 動態調整字體防止遮擋 */

            flex: 1; word-break: break-all; line-height: 1.2;
        }

function startGame() {

    if (audio.enabled) audio.bgm.play().catch(()=>{});

    document.getElementById('discard-btn').innerText = playerChar === 'knight' ? '捨棄(罰1)' : '捨棄(罰2)';

    initGame();
}

function initGame() {
    // 1. 根據所選範圍篩選數據
    let rawList = [...fullWordDatabase[selectedScope]];
    
    // 2. 隨機選取最多 20 個字詞
    if (rawList.length > 20) {
        rawList.sort(() => 0.5 - Math.random());
        gameDataPool = rawList.slice(0, 20);
    } else {
        gameDataPool = rawList;
    }
    
    // 3. 初始化數據 (修復：這些現在都在 initGame 裡面運行)
    unspawnedWords = [...gameDataPool];
    buildDeck();
    activeField = [];
    spawnFieldTargets(3); 
    
    // 4. 起始手牌
    playerHand = []; aiHand = [];
    hintsRemaining = 3;
    let pCount = (playerChar === 'seer') ? 4 : 5;
    let aCount = (aiDifficulty === 'hard') ? 3 : 5;
    for(let i=0; i<pCount; i++) playerHand.push(drawCard());
    for(let i=0; i<aCount; i++) aiHand.push(drawCard());
    
    updateUI();
    playSfx(`範圍：${selectedScope}。戰鬥開始！`, "player");
}

function buildDeck() {
    deck = [];
    gameDataPool.forEach(item => {
        item.字義.forEach(mean => {
            deck.push({ id: `m_${item.字詞}_${mean}`, type: 'meaning', parentWord: item.字詞, text: mean });
        });
    });
    // 增加特殊言靈牌
    for(let i=0; i<2; i++) {
        deck.push({ id: `f1_${i}`, type: 'func', action: 'attack', text: '令敵罰抽' }); 
        deck.push({ id: `f2_${i}`, type: 'func', action: 'skip', text: '封印回合' });
        deck.push({ id: `f3_${i}`, type: 'func', action: 'reset', text: '重構手牌' });
    }
    shuffle(deck);
}

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}

function isMeaningNeeded(card) {
    if (card.type !== 'meaning') return true; // 言靈牌（功能牌）永遠有效

    // 1. 檢查該字詞是否正在場上，且該字義尚未被破譯
    const targetOnField = activeField.find(t => t.word === card.parentWord);
    if (targetOnField) {
        const meaningStatus = targetOnField.meanings.find(m => m.text === card.text);
        if (meaningStatus && !meaningStatus.unlocked) return true;
    }

    // 2. 檢查該字詞是否還在等待生成的隊列中（尚未出現在場上）
    const inUnspawned = unspawnedWords.find(w => w.字詞 === card.parentWord);
    if (inUnspawned) return true;

    // 如果場上沒有這個字（或已破譯），且隊列裡也沒有這個字，這張牌就是廢牌
    return false;
}

// 修改後的抽牌邏輯
function drawCard() {
    // 如果牌庫空了，嘗試洗掉棄牌堆
    if (deck.length === 0) {
        if (discardPile.length === 0) return null;
        deck = [...discardPile]; 
        discardPile = []; 
        shuffle(deck);
    }

    // 抽出一張牌
    let card = deck.pop();

    // 核心邏輯：如果是字義牌且已經不再需要，則直接廢棄並重抽
    if (card && card.type === 'meaning' && !isMeaningNeeded(card)) {
        // 這張牌被永久移除（不進入 discardPile 循環），確保牌庫越來越乾淨
        return drawCard(); 
    }

    return card;
}
    
function spawnFieldTargets(count) {
    for(let i=0; i<count; i++) {
        if(unspawnedWords.length === 0) break;
        let item = unspawnedWords.splice(Math.floor(Math.random() * unspawnedWords.length), 1)[0];
        
        let meaningsData = item.字義.map(m => {
            // 優化匹配邏輯：只要字義字串互相包含，就視為同一義項
            let exObj = item.用例 ? item.用例.find(e => 
                m.includes(e.用例字義) || e.用例字義.includes(m)
            ) : null;
            
            return { 
                text: m, 
                example: exObj ? exObj.句子 : null, 
                unlocked: false 
            };
        });
        activeField.push({ word: item.字詞, meanings: meaningsData });
    }
}

    document.getElementById('player-hand-count').innerText = playerHand.length + " 張";
    document.getElementById('ai-hand-count').innerText = aiHand.length + " 張";
    const turnDisp = document.getElementById('turn-display');

    document.getElementById('discard-btn').disabled = (turn !== 'player' || selectedIndex === null);
    document.getElementById('recast-btn').disabled = (turn !== 'player');
    document.getElementById('pass-btn').disabled = (turn !== 'player');
    
    const hintBtn = document.getElementById('hint-btn');
    const selectedCard = playerHand[selectedIndex];
    const canUseHint = (
        turn === 'player' && 
        selectedIndex !== null && 
        selectedCard && 
        selectedCard.type === 'meaning' && 
        hintsRemaining > 0
    );

    hintBtn.disabled = !canUseHint; // 如果不符合上述任一條件，按鈕變灰(disabled)
    hintBtn.innerText = `💡 提示(${hintsRemaining}/3)`;
    // 只有在選中「字義牌」且還有次數時才可用
    hintBtn.disabled = (turn !== 'player' || selectedIndex === null || !selectedCard || selectedCard.type !== 'meaning' || hintsRemaining <= 0);
    hintBtn.innerText = `💡 提示(${hintsRemaining}/3)`;
    const funcBtn = document.getElementById('func-btn');
    if (selectedIndex !== null && playerHand[selectedIndex] && playerHand[selectedIndex].type === 'func' && turn === 'player') {
        funcBtn.style.display = 'block';
    } else {
        funcBtn.style.display = 'none';
    }

    // 場上區域
    const fieldDOM = document.getElementById('field-area');
    fieldDOM.innerHTML = '';
    activeField.forEach((target, tIdx) => {
        const tCard = document.createElement('div');
        tCard.className = 'target-card';
        tCard.innerHTML = `
            <div class="t-word">${target.word}</div>
            <div class="diamond-container">
                ${target.meanings.map(m => `<div class="diamond ${m.unlocked ? 'on' : ''}"></div>`).join('')}
            </div>`;

        // --- 這裡開始是修改後的交互邏輯 ---
        tCard.onpointerdown = (e) => { 
            if (e.button === 2) return; 
            pressStartTime = Date.now(); 
            pressTimer = setTimeout(() => showModal(tIdx), 400); 
        };

        tCard.onpointerup = () => { 
            clearTimeout(pressTimer); 
            hideModal(); // 鬆開時關閉界面
            if (Date.now() - pressStartTime < 400) {
                tryMatch(tIdx); 
            }
        };

        tCard.onpointerleave = () => { // 鼠標移出卡牌時也要關閉，防止卡死
            clearTimeout(pressTimer);
            hideModal();
        };

        tCard.onpointercancel = () => {
            clearTimeout(pressTimer);
            hideModal();
        };
        // --- 交互邏輯結束 ---

        // 這行一定要保留，負責把卡片畫到畫面上
        fieldDOM.appendChild(tCard); 
    });

    // 手牌區域 (保持您的邏輯，CSS 已處理外觀)
    const handDOM = document.getElementById('hand-area');
    handDOM.innerHTML = '';

    // 固定職階卡
    const charCard = document.createElement('div');
    charCard.className = 'play-card static-char-card';

    handDOM.appendChild(charCard);

    // 實際玩家手牌
    const wordCounts = {};
    playerHand.forEach(card => {
        if (card.type === 'meaning' && card.parentWord) {
            wordCounts[card.parentWord] = (wordCounts[card.parentWord] || 0) + 1;
        }
    });

    // 2. 為出現兩次以上的字詞分配顏色
    const hintColors = ['#e6203a', '#00b35a', '#00e5ff', '#ffdb00', '#ff6600', '#7a1fd1', '#ff00ff'];
    const wordToColor = {};
    let colorIndex = 0;
    Object.keys(wordCounts).forEach(word => {
        if (wordCounts[word] > 1) {
            wordToColor[word] = hintColors[colorIndex % hintColors.length];
            colorIndex++;
        }
    });

    // 3. 渲染實際玩家手牌
    playerHand.forEach((card, idx) => {
        if(!card) return;
        const cDiv = document.createElement('div');
        
        // 基礎 Class
        cDiv.className = `play-card ${card.type === 'func' ? 'is-func' : ''} ${idx === selectedIndex ? 'selected' : ''}`;
        
        // 如果屬於同一個字詞且有重複，加上顏色提示
        if (card.type === 'meaning' && wordToColor[card.parentWord]) {
            cDiv.classList.add('card-hint-line');
            cDiv.style.borderBottomColor = wordToColor[card.parentWord];
        }

        cDiv.innerHTML = `<div class="c-tag">${card.type === 'meaning' ? '字義' : '言靈'}</div><div class="c-text" style="font-weight:900;">${card.text}</div>`;
        
        // 綁定點擊事件
        cDiv.onclick = () => { 
            if(turn === 'player') { 
                selectedIndex = (selectedIndex === idx) ? null : idx; 
                updateUI(); 
            } 
        };
        handDOM.appendChild(cDiv);
    });

    // 6. 檢查勝負
    checkWin();
}

function showModal(tIdx) {
    let target = activeField[tIdx];
    let modal = document.getElementById('detail-modal');
    let content = document.getElementById('detail-content');
    
    let listHTML = target.meanings.map(m => {
        if (m.unlocked) {
            return `
                <div class="m-slot unlocked">
                    <span>[ 破譯 ] ${m.text}</span>
                    ${m.example ? `<div class="m-example">典籍：${m.example}</div>` : '<div class="m-example" style="color:#999;">(此義項暫無資料庫用例)</div>'}
                </div>`;
        } else {
            return `<div class="m-slot"><span style="color:#666;">[ 鎖定 ] 未知字義</span></div>`;
        }
    }).join('');

    content.innerHTML = `<div class="m-word">${target.word}</div>${listHTML}<div style="font-size:0.85rem; text-align:right; margin-top:15px; color:#555; font-weight:bold;">(放開以關閉)</div>`;
    modal.style.display = 'flex';
}
    
function hideModal() { 
    const modal = document.getElementById('detail-modal');
    if (modal) modal.style.display = 'none'; 
}

function useHint() {
    if (hintsRemaining <= 0 || selectedIndex === null) return;
    const card = playerHand[selectedIndex];
    if (card.type !== 'meaning') return;

    // 從數據庫中尋找對應的字詞資料
    const scopeData = fullWordDatabase[selectedScope];
    const wordData = scopeData.find(w => w.字詞 === card.parentWord);
    
    if (wordData) {
        // 尋找對應字義的例句
        const exampleObj = wordData.用例 ? wordData.用例.find(e => e.用例字義.includes(card.text) || card.text.includes(e.用例字義)) : null;
        const sentence = exampleObj ? `例句：${exampleObj.句子}` : "此字義在典籍中暫無對應例句。";

        // 填入內容並顯示界面
        document.getElementById('hint-word-display').innerText = `【${card.parentWord}】`;
        document.getElementById('hint-example-display').innerText = sentence;
        document.getElementById('hint-modal').style.display = 'flex';

        // 扣除次數
        hintsRemaining--;
        updateUI();
        playSfxAudio('draw'); // 播放一個輕微音效
    }
}

// 關閉提示界面
function closeHint() {
    document.getElementById('hint-modal').style.display = 'none';
}
    
function tryMatch(targetIndex) {
    if(turn !== 'player' || selectedIndex === null) return;
    let card = playerHand[selectedIndex], target = activeField[targetIndex];
    let mObj = target.meanings.find(m => m.text === card.text);
    if (mObj && !mObj.unlocked) {
        mObj.unlocked = true; discardPile.push(playerHand.splice(selectedIndex, 1)[0]);
        selectedIndex = null; playSfxAudio('correct');
        if(target.meanings.every(m => m.unlocked)) triggerBurst(targetIndex, 'player', target.meanings.length);
        else { playSfx("破譯成功！", "correct"); updateUI(); setTimeout(endTurn, 1000); }
    } else {
        triggerShake(); playSfxAudio('error'); playSfx("配對錯誤！反噬抽2張", "error");
        for(let i=0; i<2; i++) { let c = drawCard(); if(c) playerHand.push(c); }
        selectedIndex = null; updateUI(); setTimeout(endTurn, 1500);
    }
}

function triggerBurst(targetIndex, who, damage) {
    if(who === 'player') {
        playSfx(`擊破！對手遭罰抽${damage}張`, "correct");
        for(let i=0; i<damage; i++) { let c = drawCard(); if(c) aiHand.push(c); }
    } else {
        triggerShake(); playSfx(`崩潰！你遭罰抽${damage}張`, "error");
        for(let i=0; i<damage; i++) { let c = drawCard(); if(c) playerHand.push(c); }
    }
    activeField.splice(targetIndex, 1); updateUI(); setTimeout(endTurn, 2000);
}

function recastHand() {
    if(turn !== 'player') return;
    let count = playerHand.length; deck.push(...playerHand); shuffle(deck); playerHand = [];
    for(let i=0; i < count + 1; i++) { let c = drawCard(); if(c) playerHand.push(c); }
    playSfxAudio('draw'); selectedIndex = null; updateUI();
    if(playerChar === 'trickster') playSfx("【詭道】重鑄！", "player");
    else { playSfx("重鑄！結束回合", "player"); setTimeout(endTurn, 1500); }
}

function passTurn() {
    if(turn !== 'player') return;
    if(playerChar === 'rock') playSfx("【磐石】不罰抽", "player");
    else { playSfx("罰抽1張", "player"); let c = drawCard(); if(c) playerHand.push(c); playSfxAudio('draw');}
    selectedIndex = null; updateUI(); setTimeout(endTurn, 1500);
}

function discardSelected() {
    if(turn !== 'player' || selectedIndex === null) return;
    discardPile.push(playerHand.splice(selectedIndex, 1)[0]);
    let dmg = playerChar === 'knight' ? 1 : 2;
    for(let i=0; i<dmg; i++) { let c = drawCard(); if(c) playerHand.push(c); }
    playSfxAudio('draw'); selectedIndex = null; updateUI(); setTimeout(endTurn, 1500);
}

function useFunctionCard() {
    let card = playerHand[selectedIndex];
    discardPile.push(playerHand.splice(selectedIndex, 1)[0]);
    selectedIndex = null; playSfxAudio('correct');
    if(card.action === 'attack') {
        let dmg = playerChar === 'berserker' ? 3 : 2;
        playSfx(`言靈發動！敵方罰抽${dmg}張`, "player");
        for(let i=0; i<dmg; i++) { let c = drawCard(); if(c) aiHand.push(c); }
    } else if (card.action === 'skip') { playSfx("封印敵方回合！", "player"); skipNextAi = true; }
    else if (card.action === 'reset') { playSfx("重構手牌！", "player"); playerHand = []; for(let i=0; i<5; i++) { let c = drawCard(); if(c) playerHand.push(c); } }
    updateUI(); setTimeout(() => { if(skipNextAi) { skipNextAi = false; turn = 'player'; spawnFieldTargets(1); updateUI(); } else endTurn(); }, 1500);
}

function endTurn() {
    turn = turn === 'player' ? 'ai' : 'player'; selectedIndex = null;
    if(turn === 'player') spawnFieldTargets(1);
    updateUI(); if(turn === 'ai') setTimeout(aiAction, 1500);
}

function aiAction() {
    if(aiHand.length === 0) return;
    let funcIdx = aiHand.findIndex(c => c.type === 'func');
    if (funcIdx > -1) {
        let card = aiHand.splice(funcIdx, 1)[0]; discardPile.push(card);
        if(card.action === 'attack') { triggerShake(); playSfxAudio('error'); playSfx("敵方言靈！令你罰抽", "ai"); for(let i=0; i<2; i++) { let c = drawCard(); if(c) playerHand.push(c); } updateUI(); setTimeout(endTurn, 1500); return; }
        else if (card.action === 'skip') { playSfx("敵方封印你一回合！", "ai"); updateUI(); setTimeout(aiAction, 1500); return; }
        else if (card.action === 'reset') { playSfx("敵方重構手牌", "ai"); aiHand = []; for(let i=0; i<5; i++) { let c = drawCard(); if(c) aiHand.push(c); } updateUI(); setTimeout(endTurn, 1500); return; }
    }
    let matched = false;
    let isEasyMiss = (aiDifficulty === 'easy' && Math.random() < 0.5);
    if (!isEasyMiss) {
        for (let i = 0; i < aiHand.length; i++) {
            let card = aiHand[i]; if(card.type !== 'meaning') continue;
            for(let tIdx = 0; tIdx < activeField.length; tIdx++) {
                let mObj = activeField[tIdx].meanings.find(m => m.text === card.text);
                if(mObj && !mObj.unlocked) {
                    mObj.unlocked = true; discardPile.push(aiHand.splice(i, 1)[0]); matched = true;
                    if(activeField[tIdx].meanings.every(mm=>mm.unlocked)) triggerBurst(tIdx, 'ai', activeField[tIdx].meanings.length);
                    else { playSfxAudio('error'); playSfx("敵方成功破譯！", "ai"); updateUI(); setTimeout(endTurn, 1500); }
                    break;
                }
            }
            if(matched) break;
        }
    }
    if(!matched) {
        if(aiHand.length > 0) discardPile.push(aiHand.pop());
        for(let k=0; k<2; k++) { let c = drawCard(); if(c) aiHand.push(c); }
        updateUI(); setTimeout(endTurn, 1500);
    }
}

function playSfx(text, type) {
    const sfx = document.getElementById('sfx-layer');
    sfx.innerText = text; sfx.className = `sfx-box sfx-${type}`;
    sfx.style.animation = 'none'; void sfx.offsetWidth; sfx.style.animation = 'popInStay 2.5s forwards';
}
function checkWin() {    
    // 【保險鎖】如果遊戲已經判定結束，直接跳出，不再執行後面的彈窗邏輯
    if (isGameOver) return;

    let winner = null;
    let resultMsg = "";

    // 1. 基礎勝負：某一方手牌清空
    if (playerHand.length === 0) {
        winner = 'player';
        resultMsg = "你率先破譯所有言靈，贏得了最終勝利！";
    } else if (aiHand.length === 0) {
        winner = 'ai';
        resultMsg = "AI 已清空手牌，你被擊敗了。";
    }
    // 2. 終局比牌：當所有備選字詞都已出完且場上也被清空時
    else if (unspawnedWords.length === 0 && activeField.length === 0) {
        let pLen = playerHand.length;
        let aLen = aiHand.length;
        resultMsg = `所有字詞已全部破譯！\n你的剩餘手牌：${pLen} 張\n敵方剩餘手牌：${aLen} 張\n\n`;

        if (pLen < aLen) {
            winner = 'player';
            resultMsg += "恭喜！你以更少的手牌贏得了最終勝利！";
        } else if (pLen > aLen) {
            winner = 'ai';
            resultMsg += "遺憾！敵方殘餘手牌更少，你輸了。";
        } else {
            winner = 'draw';
            resultMsg += "雙方殘餘手牌數量相同，戰成平手！";
        }
    }

    // 如果判定出勝負，則鎖定狀態並顯示彈窗
    if (winner) {
        isGameOver = true; // 【關鍵】立刻鎖死，防止 updateUI 重複觸發此函數
        showResultModal(winner, resultMsg);
    }
}
// 顯示結果彈窗
function showResultModal(winner, msg) {
    const modal = document.getElementById('result-modal');
    const title = document.getElementById('result-title-text');
    const winnerName = document.getElementById('result-winner-name');
    const stats = document.getElementById('result-stats-text');

    modal.style.display = 'flex';
    stats.innerText = msg;

    if (winner === 'player') {
        title.innerText = "完勝！";
        winnerName.innerText = "挑戰者 獲勝";
        winnerName.className = "winner-player";
        playSfxAudio('correct');
    } else if (winner === 'ai') {
        title.innerText = "敗北...";
        winnerName.innerText = "絕對記憶 AI 獲勝";
        winnerName.className = "winner-ai";
        playSfxAudio('error');
    } else {
        title.innerText = "平局";
        winnerName.innerText = "勢均力敵";
        winnerName.className = "winner-draw";
    }
}

let isReviewing = false;
let reviewAborted = false; 
let reviewClickCount = 0;

async function startReviewAnimation() {
    if (isReviewing) return;
    
    // 1. 隱藏結算界面，顯示跳過提示
    const resultModal = document.getElementById('result-modal');
    if (resultModal) resultModal.style.display = 'none';
    document.getElementById('skip-hint-ui').style.display = 'block';

    isReviewing = true;
    reviewAborted = false;
    reviewClickCount = 0; 

    // 2. 獲取手牌資訊
    const handElements = document.querySelectorAll('#hand-area .play-card:not(.static-char-card)');
    const cardRects = Array.from(handElements).map(el => el.getBoundingClientRect());
    
    const taskList = [];
    playerHand.forEach((card, i) => {
        if (card && card.type === 'meaning' && handElements[i]) {
            taskList.push({
                data: card,
                element: handElements[i],
                rect: cardRects[i]
            });
        }
    });

    // 3. 依序執行歸位動畫
    for (const task of taskList) {
        if (reviewAborted) break;

        const { data, element, rect } = task;
        element.style.visibility = "hidden";

        // 創建飛行幻影
        const fly = document.createElement('div');
        fly.className = 'flying-card';
        fly.style.opacity = "1"; // 確保完全不透明
        fly.innerHTML = `<div class="c-tag">字義</div><div class="c-text" style="font-weight:900;">${data.text}</div>`;
        
        // 鎖定初始位置與原本大小
        fly.style.width = rect.width + 'px';
        fly.style.height = rect.height + 'px';
        fly.style.top = rect.top + 'px';
        fly.style.left = rect.left + 'px';
        document.body.appendChild(fly);

        // 尋找場上目標
        const targetIdx = activeField.findIndex(t => t.word === data.parentWord);
        const targetCards = document.querySelectorAll('.target-card');
        const targetDOM = targetCards[targetIdx];

        // --- 動畫階段 1：向上彈起 ---
        requestAnimationFrame(() => {
            fly.style.transform = "translateY(-60px) rotate(-5deg) scale(1)"; 
            fly.style.opacity = "1";
        });

        await new Promise(r => setTimeout(r, 150)); 

        if (targetDOM && !reviewAborted) {
            // --- 動畫階段 2：飛向目標中心 (維持 1.0 比例) ---
            const endRect = targetDOM.getBoundingClientRect();
            const targetCenterX = endRect.left + endRect.width / 2;
            const targetCenterY = endRect.top + endRect.height / 2;
            
            fly.style.top = (targetCenterY - rect.height / 2) + 'px';
            fly.style.left = (targetCenterX - rect.width / 2) + 'px';
            fly.style.transform = "translateY(0) rotate(0deg) scale(1)"; 
            fly.style.opacity = "1"; 

            // --- 動畫階段 3：抵達反饋 ---
            setTimeout(() => {
                if (!reviewAborted) {
                    targetDOM.style.transition = "0.3s";
                    targetDOM.style.boxShadow = "0 0 30px 10px var(--c-green)";
                    targetDOM.style.borderColor = "var(--c-green)";
                    playSfxAudio('correct'); 
                    
                    setTimeout(() => {
                        targetDOM.style.boxShadow = "";
                        targetDOM.style.borderColor = "";
                    }, 800);
                }
            }, 700); 
        } else {
            fly.style.opacity = "0"; 
        }

        // 移除卡片
        setTimeout(() => fly.remove(), 1000);
        await new Promise(r => setTimeout(r, 350)); 
    }

    // 4. 動畫結束進入靜態溫習界面
    showStudyScreen();
}

// 顯示深層記憶溫習界面
function showStudyScreen() {
    isReviewing = false;
    document.getElementById('skip-hint-ui').style.display = 'none';
    
    // 清理所有殘留的飛行卡片
    document.querySelectorAll('.flying-card').forEach(el => el.remove());

    const studyModal = document.getElementById('study-modal');
    const studyGrid = document.getElementById('study-grid');
    studyGrid.innerHTML = '';

    // 展示本次遊戲池中所有字詞
    gameDataPool.forEach(wordObj => {
        const card = document.createElement('div');
        card.className = 'study-card';
        
        let meaningsHTML = wordObj.字義.map(m => {
            // 在原始 wordObj 中尋找用例，同樣使用模糊匹配
            const example = wordObj.用例 ? wordObj.用例.find(e => 
                m.includes(e.用例字義) || e.用例字義.includes(m)
            ) : null;
            
            return `
                <div class="study-m-item">
                    <b>${m}</b>
                    ${example ? `<div class="study-example">${example.句子}</div>` : '<div class="study-example" style="color:#bbb;">(暫無典籍用例)</div>'}
                </div>
            `;
        }).join('');

        card.innerHTML = `
            <div class="study-word">${wordObj.字詞}</div>
            <div class="study-meanings">${meaningsHTML}</div>
        `;
        studyGrid.appendChild(card);
    });

    studyModal.style.display = 'flex';
}
    
// 修改全局點擊監聽：雙擊立即跳過動畫
document.addEventListener('mousedown', () => {
    if (isReviewing) {
        reviewClickCount++;
        if (reviewClickCount >= 2) {
            reviewAborted = true; 
        }
    }
});

function playSfxAudio(type) { if(audio.enabled && audio[type]) audio[type].play().catch(()=>{}); }

// 初始化大廳
window.onload = () => { initLobby(); };
document.getElementById('detail-modal').onclick = hideModal;
</script>
